<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Vocab</title>
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --fg: #1a1a1a;
    --fg2: #6b6b6b;
    --accent: #2563EB;
    --accent-light: #EFF4FF;
    --border: #e5e5e0;
    --danger: #dc2626;
    --danger-light: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --surface: #1e1e1e;
      --fg: #e8e8e4;
      --fg2: #9a9a9a;
      --accent: #60a5fa;
      --accent-light: #1e2a3a;
      --border: #2a2a2a;
      --danger: #f87171;
      --danger-light: #2a1a1a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    padding: 0 16px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.6rem; text-align: center; }

  .add-area {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: 0.5rem 0 0.4rem;
  }

  .add-row { display: flex; gap: 8px; margin-bottom: 6px; }

  .add-row input {
    flex: 1; min-width: 0; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--fg);
    font-family: inherit; font-size: 0.95rem; outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row input::placeholder { color: var(--fg2); }

  .btn {
    padding: 10px 16px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff;
    font-family: inherit; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn:active { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; }

  .tabs {
    display: flex; margin-bottom: 0.5rem;
    border-bottom: 1.5px solid var(--border);
  }
  .tab {
    flex: 1; text-align: center; padding: 8px 0;
    font-size: 0.85rem; font-weight: 500; color: var(--fg2);
    cursor: pointer; border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1.5px; background: none; font-family: inherit;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .status { text-align: center; font-size: 0.82rem; padding: 0.3rem 0; }
  .status.loading { color: var(--fg2); }
  .status.error { color: var(--danger); }

  .count { text-align: center; font-size: 0.8rem; color: var(--fg2); margin: 0.3rem 0 0.6rem; }

  .word-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 2rem; }

  .word-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; position: relative;
  }

  .word-header {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 6px; padding-right: 30px; flex-wrap: wrap;
  }
  .word-name { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
  .word-phonetic { font-size: 0.82rem; color: var(--fg2); }
  .sound-btn {
    background: none; border: none; cursor: pointer;
    padding: 2px 4px; font-size: 0.85rem; color: var(--accent);
  }

  .word-pos {
    display: inline-block; font-size: 0.72rem; font-weight: 600;
    color: var(--accent); background: var(--accent-light);
    padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 4px;
  }

  .word-def { font-size: 0.88rem; color: var(--fg); line-height: 1.55; margin-top: 2px; }

  .word-actions { position: absolute; top: 12px; right: 12px; }
  .word-actions button {
    background: none; border: none; cursor: pointer;
    padding: 4px 6px; font-size: 1rem; line-height: 1;
    color: var(--fg2); border-radius: 6px;
  }
  .word-actions button:active { background: var(--danger-light); color: var(--danger); }

  .empty { text-align: center; color: var(--fg2); font-size: 0.9rem; margin-top: 3rem; line-height: 1.6; }

  .manual-area { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .manual-area .row { display: flex; gap: 6px; }
  .manual-area input {
    flex: 1; min-width: 0; padding: 8px 10px;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--fg);
    font-family: inherit; font-size: 0.85rem; outline: none;
  }
  .manual-area input:focus { border-color: var(--accent); }
  .manual-area button {
    padding: 8px 12px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit;
  }

  .date-label { font-size: 0.72rem; color: var(--fg2); margin-top: 6px; }
</style>
</head>
<body>

<h1>My Vocab</h1>

<div class="add-area">
  <div class="add-row">
    <input type="text" id="wordInput" placeholder="输入单词，自动查询" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button class="btn" id="addBtn">查询</button>
  </div>
</div>

<div id="statusArea"></div>

<div class="tabs">
  <button class="tab active" data-tab="all">全部</button>
  <button class="tab" data-tab="recent">最近7天</button>
  <button class="tab" data-tab="search">搜索</button>
</div>

<div id="searchBox" style="display:none;margin-bottom:0.5rem">
  <div class="add-row">
    <input type="text" id="searchInput" placeholder="搜索单词...">
  </div>
</div>

<div class="count" id="count"></div>
<div class="word-list" id="list"></div>

<script>
(function() {
  var KEY = 'my_vocab_v2';
  var words = [];
  var currentTab = 'all';
  var searchFilter = '';

  function load() {
    try { var d = localStorage.getItem(KEY); if (d) words = JSON.parse(d); } catch(e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(words)); } catch(e) {}
  }

  function showStatus(msg, type) {
    document.getElementById('statusArea').innerHTML = '<div class="status ' + type + '">' + msg + '</div>';
  }
  function clearStatus() { document.getElementById('statusArea').innerHTML = ''; }

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ===== API 1: Free Dictionary API (needs VPN in China) =====
  function tryFreeDictAPI(word) {
    return new Promise(function(resolve) {
      var ctrl = new AbortController();
      var timer = setTimeout(function() { ctrl.abort(); }, 4000);
      fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), { signal: ctrl.signal })
        .then(function(res) {
          clearTimeout(timer);
          if (!res.ok) { resolve(null); return; }
          return res.json();
        })
        .then(function(data) {
          if (!data || !data[0]) { resolve(null); return; }
          var d = data[0];
          var entry = { word: d.word, phonetic: '', audioUrl: '', meanings: [], addedAt: Date.now() };
          if (d.phonetics) {
            for (var i = 0; i < d.phonetics.length; i++) {
              if (d.phonetics[i].text && !entry.phonetic) entry.phonetic = d.phonetics[i].text;
              if (d.phonetics[i].audio && !entry.audioUrl) entry.audioUrl = d.phonetics[i].audio;
            }
          }
          if (!entry.phonetic && d.phonetic) entry.phonetic = d.phonetic;
          if (d.meanings) {
            for (var j = 0; j < d.meanings.length; j++) {
              var m = d.meanings[j];
              var defs = (m.definitions || []).slice(0, 2).map(function(x) { return x.definition; });
              if (defs.length) entry.meanings.push({ pos: m.partOfSpeech, defs: defs });
            }
          }
          resolve(entry);
        })
        .catch(function() { clearTimeout(timer); resolve(null); });
    });
  }

  // ===== API 2: Youdao Dict (works in China without VPN) =====
  function tryYoudaoAPI(word) {
    return new Promise(function(resolve) {
      var ctrl = new AbortController();
      var timer = setTimeout(function() { ctrl.abort(); }, 4000);
      fetch('https://dict.youdao.com/jsonapi_s?doctype=json&jsonversion=4&le=en&q=' + encodeURIComponent(word), { signal: ctrl.signal })
        .then(function(res) {
          clearTimeout(timer);
          if (!res.ok) { resolve(null); return; }
          return res.json();
        })
        .then(function(data) {
          if (!data) { resolve(null); return; }
          var entry = { word: word, phonetic: '', audioUrl: '', meanings: [], addedAt: Date.now() };
          // Extract phonetic
          try {
            if (data.ec && data.ec.word && data.ec.word[0]) {
              var w = data.ec.word[0];
              if (w.usphone) entry.phonetic = '/' + w.usphone + '/';
              else if (w.ukphone) entry.phonetic = '/' + w.ukphone + '/';
              // Youdao audio
              entry.audioUrl = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
              // Extract meanings
              if (w.trs) {
                for (var i = 0; i < w.trs.length && i < 3; i++) {
                  var tr = w.trs[i];
                  if (tr.tr && tr.tr[0] && tr.tr[0].l && tr.tr[0].l.i) {
                    var text = tr.tr[0].l.i.join('');
                    // Parse "pos. definition" format like "n. 你好"
                    var match = text.match(/^([a-z]+\.)\s*(.+)/);
                    if (match) {
                      entry.meanings.push({ pos: match[1], defs: [match[2]] });
                    } else {
                      entry.meanings.push({ pos: '', defs: [text] });
                    }
                  }
                }
              }
            }
          } catch(e) {}
          if (entry.meanings.length > 0) resolve(entry);
          else resolve(null);
        })
        .catch(function() { clearTimeout(timer); resolve(null); });
    });
  }

  // ===== API 3: Youdao audio only (works in China) =====
  function getYoudaoAudio(word) {
    return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
  }

  // ===== API 3: Youdao JSONP (bypasses CORS) =====
  function tryYoudaoJSONP(word) {
    return new Promise(function(resolve) {
      var cbName = '_yd_cb_' + Date.now();
      var timer = setTimeout(function() {
        delete window[cbName];
        var s = document.getElementById(cbName);
        if (s) s.remove();
        resolve(null);
      }, 5000);

      window[cbName] = function(data) {
        clearTimeout(timer);
        delete window[cbName];
        var s = document.getElementById(cbName);
        if (s) s.remove();
        try {
          var entry = { word: word, phonetic: '', audioUrl: getYoudaoAudio(word), meanings: [], addedAt: Date.now() };
          if (data && data.ec && data.ec.word && data.ec.word[0]) {
            var w = data.ec.word[0];
            if (w.usphone) entry.phonetic = '/' + w.usphone + '/';
            else if (w.ukphone) entry.phonetic = '/' + w.ukphone + '/';
            if (w.trs) {
              for (var i = 0; i < w.trs.length && i < 3; i++) {
                var tr = w.trs[i];
                if (tr.tr && tr.tr[0] && tr.tr[0].l && tr.tr[0].l.i) {
                  var text = tr.tr[0].l.i.join('');
                  var match = text.match(/^([a-z]+\.)\s*(.+)/);
                  if (match) entry.meanings.push({ pos: match[1], defs: [match[2]] });
                  else entry.meanings.push({ pos: '', defs: [text] });
                }
              }
            }
          }
          resolve(entry.meanings.length > 0 ? entry : null);
        } catch(e) { resolve(null); }
      };

      var script = document.createElement('script');
      script.id = cbName;
      script.src = 'https://dict.youdao.com/jsonapi_s?doctype=jsonp&jsonversion=4&le=en&callback=' + cbName + '&q=' + encodeURIComponent(word);
      script.onerror = function() { clearTimeout(timer); delete window[cbName]; script.remove(); resolve(null); };
      document.head.appendChild(script);
    });
  }

  // ===== Main lookup: try all APIs =====
  async function lookupAndAdd(word) {
    word = word.trim();
    if (!word) return;

    if (words.find(function(w) { return w.word.toLowerCase() === word.toLowerCase(); })) {
      showStatus('这个词已经在词典里了', 'error');
      setTimeout(clearStatus, 2000);
      return;
    }

    showStatus('查询中...', 'loading');
    document.getElementById('addBtn').disabled = true;

    var errors = [];

    // Try Free Dictionary API first
    var freeDict = null;
    try { freeDict = await tryFreeDictAPI(word.toLowerCase()); }
    catch(e) { errors.push('FreeDict: ' + e.message); }

    // Try Youdao
    var youdao = null;
    try { youdao = await tryYoudaoAPI(word.toLowerCase()); }
    catch(e) { errors.push('Youdao: ' + e.message); }

    // Try Youdao JSONP as last resort
    if (!youdao) {
      try { youdao = await tryYoudaoJSONP(word.toLowerCase()); }
      catch(e) { errors.push('YoudaoJSONP: ' + e.message); }
    }

    if (freeDict) {
      if (!freeDict.audioUrl) freeDict.audioUrl = getYoudaoAudio(word.toLowerCase());
      words.unshift(freeDict);
      save();
      document.getElementById('wordInput').value = '';
      clearStatus();
      render();
      document.getElementById('wordInput').focus();
      return;
    }

    if (youdao) {
      words.unshift(youdao);
      save();
      document.getElementById('wordInput').value = '';
      clearStatus();
      render();
      document.getElementById('wordInput').focus();
      return;
    }

    // Both failed — show error detail and manual entry
    if (errors.length) showStatus('查询失败: ' + errors.join('; '), 'error');
    else clearStatus();
    var entry = {
      word: word,
      phonetic: '',
      audioUrl: getYoudaoAudio(word.toLowerCase()),
      meanings: [],
      addedAt: Date.now(),
      needsEdit: true
    };
    words.unshift(entry);
    save();
    document.getElementById('wordInput').value = '';
    render();
    document.getElementById('addBtn').disabled = false;
  }

  function deleteWord(i) { words.splice(i, 1); save(); render(); }

  function playAudio(url) {
    if (!url) return;
    new Audio(url).play().catch(function() {});
  }

  function saveDef(i, def, phonetic) {
    if (!def || !def.trim()) return;
    words[i].meanings = [{ pos: '', defs: [def.trim()] }];
    if (phonetic && phonetic.trim()) words[i].phonetic = phonetic.trim();
    delete words[i].needsEdit;
    save();
    render();
  }

  function formatDate(ts) {
    var d = new Date(ts);
    return (d.getMonth()+1) + '/' + d.getDate();
  }

  function getFiltered() {
    var list = words;
    if (currentTab === 'recent') {
      var cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
      list = list.filter(function(w) { return w.addedAt > cutoff; });
    } else if (currentTab === 'search' && searchFilter) {
      var q = searchFilter.toLowerCase();
      list = list.filter(function(w) {
        return w.word.toLowerCase().indexOf(q) !== -1 ||
          w.meanings.some(function(m) { return m.defs.some(function(d) { return d.toLowerCase().indexOf(q) !== -1; }); });
      });
    }
    return list;
  }

  function render() {
    document.getElementById('addBtn').disabled = false;
    var filtered = getFiltered();
    document.getElementById('count').textContent = filtered.length !== words.length
      ? '共 ' + words.length + ' 个单词，显示 ' + filtered.length + ' 个'
      : '共 ' + words.length + ' 个单词';

    var listEl = document.getElementById('list');
    if (filtered.length === 0) {
      listEl.innerHTML = words.length === 0
        ? '<div class="empty">还没有单词<br>输入单词自动查询音标和释义</div>'
        : '<div class="empty">没有匹配的单词</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function(w) {
      var ri = words.indexOf(w);
      var audioBtn = w.audioUrl
        ? '<button class="sound-btn" onclick="window._play(\'' + esc(w.audioUrl) + '\')">🔊</button>' : '';
      var phoneticText = w.phonetic ? '<span class="word-phonetic">' + esc(w.phonetic) + '</span>' : '';

      var meaningsHTML = '';
      if (w.meanings && w.meanings.length > 0) {
        meaningsHTML = w.meanings.map(function(m) {
          var posTag = m.pos ? '<span class="word-pos">' + esc(m.pos) + '</span>' : '';
          return posTag + m.defs.map(function(d) {
            return '<div class="word-def">' + esc(d) + '</div>';
          }).join('');
        }).join('');
      }

      var manualHTML = '';
      if (w.needsEdit) {
        manualHTML = '<div class="manual-area">' +
          '<div style="font-size:0.82rem;color:var(--fg2)">自动查询失败，手动输入：</div>' +
          '<div class="row"><input id="mph-' + ri + '" type="text" placeholder="音标（选填）" style="max-width:45%">' +
          '<input id="mdef-' + ri + '" type="text" placeholder="释义" onkeydown="if(event.key===\'Enter\')window._saveDef(' + ri + ')"></div>' +
          '<div class="row" style="justify-content:flex-end"><button onclick="window._saveDef(' + ri + ')">保存</button></div></div>';
      }

      return '<div class="word-card">' +
        '<div class="word-actions"><button onclick="window._del(' + ri + ')">✕</button></div>' +
        '<div class="word-header">' +
          '<span class="word-name">' + esc(w.word) + '</span>' + audioBtn + phoneticText +
        '</div>' + meaningsHTML + manualHTML +
        '<div class="date-label">' + formatDate(w.addedAt) + '</div></div>';
    }).join('');
  }

  // Tabs
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      document.getElementById('searchBox').style.display = currentTab === 'search' ? 'block' : 'none';
      if (currentTab === 'search') document.getElementById('searchInput').focus();
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', function() {
    searchFilter = this.value.trim(); render();
  });

  document.getElementById('addBtn').addEventListener('click', function() {
    lookupAndAdd(document.getElementById('wordInput').value);
  });
  document.getElementById('wordInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') lookupAndAdd(this.value);
  });

  window._del = deleteWord;
  window._play = playAudio;
  window._saveDef = function(i) {
    var defEl = document.getElementById('mdef-' + i);
    var phEl = document.getElementById('mph-' + i);
    if (defEl) saveDef(i, defEl.value, phEl ? phEl.value : '');
  };

  load();
  render();
})();
</script>
</body>
</html>
